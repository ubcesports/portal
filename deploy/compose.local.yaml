# For locally testing services using docker
name: portal

services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    env_file:
      - ../backend/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../backend
    restart: "no"
    env_file:
      - ../backend/.env
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGSSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        export PGUSER="$${POSTGRES_USER}"
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        export PGDATABASE="$${POSTGRES_DB}"
        exec /usr/local/bin/goose -dir /app/sql/migrations postgres "" up

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    environment:
      BASE_URL: http://0.0.0.0:8080
      FRONTEND_URL: http://localhost:3000
      OAUTH_CALLBACK_URL: http://localhost:8080/auth/oauth/zetrova/callback
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    labels:
      com.ubcea.logs.enabled: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      - backend
    environment:
      API_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
    labels:
      com.ubcea.logs.enabled: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  stripe-webhook:
    image: stripe/stripe-cli:latest
    env_file:
      - ../backend/.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        export STRIPE_API_KEY="$${STRIPE_SECRET_KEY}"
        exec /bin/stripe listen \
          --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired \
          --forward-to http://backend:8080/webhooks/stripe
    depends_on:
      - backend
    labels:
      com.ubcea.logs.enabled: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    env_file:
      - ../backend/.env
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    restart: unless-stopped

volumes:
  postgres-data:
    name: portal-postgres-data
  alloy-data:
